name: Build Manager

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Rebrand All to Weather
        run: |
          # 1. AndroidManifest me direct hardcoded label aur strings change karna
          sed -i 's/android:label="KernelSU"/android:label="Weather"/g' manager/app/src/main/AndroidManifest.xml
          find manager/app/src/main/ -name "*.xml" -exec sed -i 's/KernelSU/Weather/g' {} +

          # 2. Weather PNG icon download karna
          curl -sL "https://raw.githubusercontent.com/google/material-design-icons/master/png/image/wb_sunny/materialicons/48dp/2x/baseline_wb_sunny_black_48dp.png" -o weather.png

          # 3. Purane default mipmap icons aur adaptive layers override karna
          for dir in manager/app/src/main/res/mipmap-*; do
            cp -f weather.png "$dir/ic_launcher.png" 2>/dev/null || true
            cp -f weather.png "$dir/ic_launcher_round.png" 2>/dev/null || true
            cp -f weather.png "$dir/ic_launcher_foreground.png" 2>/dev/null || true
          done

          # 4. Drawable folders me bhi icon layers override karna
          for dir in manager/app/src/main/res/drawable*; do
            cp -f weather.png "$dir/ic_launcher_background.png" 2>/dev/null || true
            cp -f weather.png "$dir/ic_launcher_foreground.png" 2>/dev/null || true
          done

      - name: Build Manager APK
        working-directory: manager
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Weather Manager APK
        uses: actions/upload-artifact@v4
        with:
          name: Weather-Manager
          path: manager/app/build/outputs/apk/debug/*.apk
