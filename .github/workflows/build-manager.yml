name: Build Manager

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Weather Rebrand
        run: |
          # 1. Sabhi languages me app name Weather karna
          find manager/app/src/main/res/ -name "strings.xml" -exec sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Weather<\/string>/g' {} +

          # 2. Weather icon replace karna
          curl -sL "https://raw.githubusercontent.com/google/material-design-icons/master/png/image/wb_sunny/materialicons/48dp/2x/baseline_wb_sunny_black_48dp.png" -o weather.png
          for dir in manager/app/src/main/res/mipmap-*; do
            cp weather.png "$dir/ic_launcher.png" 2>/dev/null || true
            cp weather.png "$dir/ic_launcher_round.png" 2>/dev/null || true
          done

      - name: Build Manager APK
        working-directory: manager
        run: ./gradlew assembleDebug

      - name: Upload Weather Manager APK
        uses: actions/upload-artifact@v4
        with:
          name: Weather-Manager
          path: manager/app/build/outputs/apk/debug/*.apk
          
