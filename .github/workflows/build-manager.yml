name: Build Manager
on:
  workflow_dispatch:
    inputs:
      KSU_PACKAGE_NAME:
        description: 'Package Name (e.g. com.example.app)'
        required: false
        default: 'com.example.myapp'
      KSU_NAME:
        description: 'App Name (e.g. MyApp)'
        required: false
        default: 'MyRootApp'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Grant execute permission for gradlew
      run: chmod +x manager/gradlew
    - name: Build Manager APK
      run: |
        cd manager
        ./gradlew assembleDebug -PKSU_PACKAGE_NAME="${{ github.event.inputs.KSU_PACKAGE_NAME }}" -PKSU_NAME="${{ github.event.inputs.KSU_NAME }}"
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: manager
        path: manager/app/build/outputs/apk/debug/*.apk
