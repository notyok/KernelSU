name: Build Manager

on:
  workflow_dispatch:
  push:
    branches: [ "main", "dev", "ci" ]
    paths:
      - '.github/workflows/build-manager.yml'
      - '.github/workflows/build-lkm.yml'
      - '.github/workflows/ddk-lkm.yml'
      - '.github/workflows/ksud.yml'
      - '.github/workflows/ksud-extra.yml'
      - '.github/workflows/ksuinit.yml'
      - '.github/scripts/setup-rust-build.sh'
      - '.github/riscv64-cargo.toml'
      - 'repack_apk.py'
      - 'manager/**'
      - 'kernel/**'
      - 'userspace/**'
  pull_request:
    branches: [ "main", "dev" ]
    paths:
      - '.github/workflows/build-manager.yml'
      - '.github/workflows/build-lkm.yml'
      - '.github/workflows/ddk-lkm.yml'
      - '.github/workflows/ksud.yml'
      - '.github/workflows/ksud-extra.yml'
      - '.github/workflows/ksuinit.yml'
      - '.github/scripts/setup-rust-build.sh'
      - '.github/riscv64-cargo.toml'
      - 'repack_apk.py'
      - 'manager/**'
      - 'kernel/**'
      - 'userspace/**'

jobs:
  generate-key:
    runs-on: ubuntu-latest
    outputs:
      expected_size: ${{ steps.extract.outputs.expected_size }}
      expected_hash: ${{ steps.extract.outputs.expected_hash }}
      keystore: ${{ steps.gen.outputs.keystore }}
      keystore_password: ${{ steps.gen.outputs.keystore_password }}
      key_password: ${{ steps.gen.outputs.key_password }}
    steps:
      - name: Generate random password
        id: gen
        run: |
          KEYSTORE_PASSWORD=$(openssl rand -base64 32)
          KEY_PASSWORD=$(openssl rand -base64 32)
          echo "keystore_password=$KEYSTORE_PASSWORD" >> $GITHUB_OUTPUT
          echo "key_password=$KEY_PASSWORD" >> $GITHUB_OUTPUT
          keytool -genkeypair \
            -alias pr-key \
            -keypass "$KEY_PASSWORD" \
            -keystore keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -dname "CN=PR, OU=PR, O=PR, L=PR, S=PR, C=PR" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000
          echo "keystore=$(base64 -w 0 keystore.jks)" >> $GITHUB_OUTPUT

      - name: Extract Certificate Info
        id: extract
        run: |
          CERT_DER=$(mktemp)
          keytool -exportcert \
            -alias pr-key \
            -keystore keystore.jks \
            -storepass "${{ steps.gen.outputs.keystore_password }}" \
            -file "$CERT_DER"

          SIZE_DEC=$(stat -c%s "$CERT_DER")
          SIZE_HEX=$(printf "%04x" "$SIZE_DEC")
          HASH=$(sha256sum "$CERT_DER" | cut -d' ' -f1)

          echo "expected_size=$SIZE_HEX" >> $GITHUB_OUTPUT
          echo "expected_hash=$HASH" >> $GITHUB_OUTPUT

  build-lkm:
    needs: generate-key
    uses: ./.github/workflows/build-lkm.yml
    with:
      expected_size2: ${{ needs.generate-key.outputs.expected_size || '' }}
      expected_hash2: ${{ needs.generate-key.outputs.expected_hash || '' }}

  build-ksuinit:
    uses: ./.github/workflows/ksuinit.yml

  build-ksud:
    needs: [build-lkm, build-ksuinit]
    strategy:
      matrix:
        include:
          - target: aarch64-linux-android
            os: ubuntu-latest
          - target: x86_64-linux-android
            os: ubuntu-latest
    uses: ./.github/workflows/ksud.yml
    with:
      target: ${{ matrix.target }}
      os: ${{ matrix.os }}

  build-manager:
    needs: [build-ksud, generate-key]
    if: always() && needs.build-ksud.result == 'success' && needs.generate-key.result == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: manager
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download ksud aarch64
        uses: actions/download-artifact@v4
        with:
          name: ksud-aarch64-linux-android
          path: aarch64-linux-android

      - name: Download ksud x86_64
        uses: actions/download-artifact@v4
        with:
          name: ksud-x86_64-linux-android
          path: x86_64-linux-android

      - name: Copy ksud to jniLibs
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/x86_64
          cp -f ../aarch64-linux-android/release/ksud app/src/main/jniLibs/arm64-v8a/libksud.so
          cp -f ../x86_64-linux-android/release/ksud app/src/main/jniLibs/x86_64/libksud.so

      - name: Weather Rebrand
        run: |
          find app/src/main/res/ -name "strings.xml" -exec sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Weather<\/string>/g' {} +
          curl -sL "https://raw.githubusercontent.com/google/material-design-icons/master/png/image/wb_sunny/materialicons/48dp/2x/baseline_wb_sunny_black_48dp.png" -o weather.png
          for dir in app/src/main/res/mipmap-*; do
            cp weather.png "$dir/ic_launcher.png" 2>/dev/null || true
            cp weather.png "$dir/ic_launcher_round.png" 2>/dev/null || true
          done

      - name: Write PR key
        env:
          PR_KEYSTORE: ${{ needs.generate-key.outputs.keystore }}
          PR_KEYSTORE_PASSWORD: ${{ needs.generate-key.outputs.keystore_password }}
          PR_KEY_PASSWORD: ${{ needs.generate-key.outputs.key_password }}
        run: |
          echo "$PR_KEYSTORE" | base64 -d > app/keystore.jks
          sed -i '/signingConfigs {/a \        release {\n            storeFile file("keystore.jks")\n            storePassword System.getenv("PR_KEYSTORE_PASSWORD")\n            keyAlias "pr-key"\n            keyPassword System.getenv("PR_KEY_PASSWORD")\n        }' app/build.gradle.kts
          sed -i 's/signingConfig = signingConfigs.getByName("debug")/signingConfig = signingConfigs.getByName("release")/g' app/build.gradle.kts

      - name: Build with Gradle
        run: ./gradlew assembleRelease

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Weather-Manager
          path: manager/app/build/outputs/apk/release/*.apk
          
