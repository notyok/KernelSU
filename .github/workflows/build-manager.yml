      - name: Customize Package Name and App Name
        run: |
          # 1. applicationId replace to com.twitter.android
          find app -name "build.gradle.kts" -o -name "build.gradle" | while read -r f; do
            sed -i 's/applicationId\s*=\s*"[^"]*"/applicationId = "com.twitter.android"/g' "$f"
            sed -i "s/applicationId\s*'[^']*'/applicationId 'com.twitter.android'/g" "$f"
          done

          # 2. App Name replace to X in strings.xml
          find app/src/main/res -name "strings.xml" | while read -r f; do
            sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">X<\/string>/g' "$f"
          done
          
